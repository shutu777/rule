upgrade:
  profiles:
    - id: sa-upgrade
      name: 殊途权重洗版
      enabled: true
      source_file_extract_metadata: true
      destination_file_extract_metadata: true
      version_control:
        enabled: false
        delete_invalid_destination_files: true
        versions:
          - name: dv
            include_conditions:
              - attribute: dolby_vision
          - name: 排除杜比
            exclude_conditions:
              - attribute: dolby_vision
      attributes:
        - key: resolution
          name: 分辨率
          weight: 6
          options:
            - name: 4320p
              pattern: 4320p
              score: 10
              description: 8K分辨率
            - name: 2160p
              pattern: 2160p
              score: 10
              description: 4K分辨率
            - name: 1080p
              pattern: 1080p
              score: 7
              description: 全高清
            - name: 720p
              pattern: 720p
              score: 4
              description: 高清
            - name: 576p
              pattern: 576p
              score: 2
              description: 标清576p
            - name: 480p
              pattern: 480p
              score: 1
              description: 标清480p
            - name: 360p
              pattern: 360p
              score: -1
              description: 低清
        - key: video_codec
          name: 视频编码
          weight: 3
          options:
            - name: AV1
              pattern: AV1
              score: 9
              description: AV1
            - name: H.264
              pattern: H.264
              score: 8
              description: H.264
            - name: H.265
              pattern: H.265
              score: 10
              description: H.265
        - key: audio_codec
          name: 音频编码
          weight: 1
          options:
            - name: DTS:X
              pattern: DTS:X
              score: 10
              description: 次世代对象音频，无损，支持3D音效
            - name: TrueHD Dolby Atmos 7.1
              pattern: TrueHD Dolby Atmos 7.1
              score: 9.5
              description: Dolby 无损 + Atmos对象音频
            - name: TrueHD Dolby Atmos 5.1
              pattern: TrueHD Dolby Atmos 5.1
              score: 9
              description: Dolby 无损 + Atmos对象音频
            - name: DTS-HD MA 7.1
              pattern: DTS-HD MA 7.1
              score: 9
              description: 无损，7.1声道
            - name: DTS-HD MA 5.1
              pattern: DTS-HD MA 5.1
              score: 8.5
              description: 无损，5.1声道
