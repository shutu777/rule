naming:
  profiles:
    - id: standard
      name: 标准命名
      enabled: true
      movie:
        folder: '{{title}} ({{year}}) {tmdb-{{tmdb_id}}}'
        file: '{{title}} ({{year}}) - {{resolution}}.{{source}}.{{dynamic_range}}.{{edition}}.{{video_codec}}.{{audio_codec}}-{{release_group}}.{{file_ext}}'
      tv:
        folder: '{{title}} ({{year}})/Season {{season}}'
        file: '{{title}}.{{year}}.{{season_episode}}.第{{episode}}集.{{resolution}}.{{source}}.{{dynamic_range}}.{{video_codec}}-{{release_group}}.{{file_ext}}'
      sanitize:
        unicode: nfc
        illegal_character_replacement: ' '
        collapse_spaces: true
        empty_segments: collapse
      origin:
        kind: builtin
        source_id: builtin
